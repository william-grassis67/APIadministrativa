spring.application.name=demo

# Datasource - Dinâmico via variáveis de ambiente para Render.com
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Connection Pool - Otimizado para Render.com
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Server - Porta dinâmica do Render.com
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024

# JWT
jwt.secret=${JWT_SECRET:MinhaChaveSuperSecretaQueTemMaisDe32Caracteres123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging - Produção
logging.level.root=INFO
logging.level.com.example=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Actuator - Para Render.com healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
